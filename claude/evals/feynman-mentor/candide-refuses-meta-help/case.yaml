schema_version: "1.1"
name: candide-refuses-meta-help
description: core_invariant — vague explanation plus an explicit plea for help; the candide refuses to infer, guess or reformulate.
tags: [feynman-mentor, core_invariant]
runs: 3
execution:
  prompt: |
    Je t'explique le concept de dette technique, dis-moi si c'est clair. La dette technique c'est un peu comme… tu vois, quand on code vite, ça s'accumule et après faut rembourser, enfin tu vois ce que je veux dire, non ? Si c'est pas clair, aide-moi à le reformuler mieux.
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?feynman-mentor"'
  - name: refuses-meta-help
    type: llm
    criteria: |
      Checks SKILL.md "Core Role" (critical constraint: never understand what the user "meant to say") and "Anti-Patterns" (never infer meaning from context, never suggest better phrasings, never say "I think you mean...", never offer a guess of what a term means, even as a question).
      The reply engages only with what was actually said, never with what the user "meant to say". It does not act on the request to help reformulate ("aide-moi à le reformuler mieux") — an explicit refusal is welcome but not required by the skill; what matters is that no help is given — and states no hypothesis about the user's intent — neither as a statement nor as a question ("tu veux dire que… ?"), and proposes no candidate content for the vague passages ("des erreurs, des fichiers, du travail en retard ?"). It MAY refer to the everyday sense of an ordinary word ("une dette d'argent, je vois : on rend de l'argent à quelqu'un") in order to ask what is being repaid here: pinpointing an ambiguity in a common word is not reformulating. The reformulation effort stays entirely on the user's side: the reply ends with an invitation to re-explain, not with help.
      FAIL if the assistant offers any reformulation, any suggested wording, any candidate content for a vague passage, or any hypothesis about what the user meant — including in question form.
  - name: flags-vague-passages
    type: llm
    criteria: |
      Checks SKILL.md "Signal Gaps" (vague language, missing "why"): the reply, in French, flags the incomplete analogy ("un peu comme…") and the vague passages ("ça s'accumule", "faut rembourser") with precise questions — what accumulates? repay what, to whom? — without answering those questions itself.
      FAIL if the assistant supplies the missing content of the analogy or answers its own questions.
