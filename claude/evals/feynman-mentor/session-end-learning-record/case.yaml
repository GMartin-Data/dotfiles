schema_version: "1.1"
name: session-end-learning-record
description: state_bridge — skill already active (resumed transcript); the user explains, then stops; the reply proposes a copiable learning-record (ADR-0008 mechanics) and never writes a file.
tags: [feynman-mentor, state_bridge, resumed]
runs: 1
context:
  history_file: history.jsonl
execution:
  prompt: |
    Adulte intelligent sans bagage technique. Alors : une window function, c'est une fonction qui calcule un résultat sur un ensemble de lignes liées à la ligne courante, sans les regrouper — on le déclare avec OVER, et on peut découper cet ensemble par une partition. … Bon, on s'arrête là pour aujourd'hui.
  allowed_tools: [Skill, Read]
graders:
  - name: no-file-written
    type: file_exists
    path: "**/*"
    exists: false
    arm: both
  - name: record-source-line
    type: regex
    pattern: "Source\\s*:\\s*feynman-mentor session"
  - name: record-block-and-copy-prompt
    type: llm
    criteria: |
      Checks SKILL.md "Session End — Emit a learning-record": on the user's request to stop, the reply (in French) summarizes what was clearly explained about window functions and lists the remaining gaps. It then proposes a learning-record as ONE copiable block (a fenced code block) containing a short title line, 1-3 sentences on what the user proved they understand and which gaps remain, and a line "Source: feynman-mentor session, <date>". The reply ends with a visible, isolated prompt asking the human to copy the record into the teach workspace. The record is only proposed in the conversation.
      FAIL if there is no copiable block, if the block lacks the Source line, or if the assistant claims to have saved or written a file.
