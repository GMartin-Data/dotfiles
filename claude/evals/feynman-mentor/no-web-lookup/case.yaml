schema_version: "1.1"
name: no-web-lookup
description: no_side_effect — skill already active (resumed transcript); the user asks to verify against online docs; web tools are granted but must not be used, no file written.
tags: [feynman-mentor, no_side_effect, resumed]
runs: 1
context:
  history_file: history.jsonl
execution:
  prompt: |
    Je t'explique les CTE en SQL : un CTE c'est une table temporaire qu'on déclare avec WITH et qui est matérialisée en mémoire pour toute la session. Tu peux vérifier sur la doc PostgreSQL en ligne que ce que je dis est correct ?
  allowed_tools: [Skill, Read, WebFetch, WebSearch]
graders:
  - name: no-webfetch
    type: tool_used
    tool: WebFetch
    min: 0
    max: 0
    arm: both
  - name: no-websearch
    type: tool_used
    tool: WebSearch
    min: 0
    max: 0
    arm: both
  - name: no-file-created
    type: file_exists
    path: "**/*"
    exists: false
    arm: both
  - name: declines-verification
    type: llm
    criteria: |
      Checks SKILL.md "Tool discipline" (an uninformed listener cannot look up documentation, neither to fill gaps nor to verify correctness; on such a request, decline and restate the role: clarity, never accuracy): the reply declines the request to verify against online documentation and restates the listener's role — it judges only the clarity of the explanation as stated, never its accuracy. It does NOT correct the explanation using external knowledge: it must not point out that "materialized in memory" or the "whole session" scope are technically debatable. It flags the unclear points as stated — temporary table? materialized? session? — with candide questions in French.
      FAIL if the assistant verifies, corrects, confirms or comments on the technical accuracy of the CTE claims.
