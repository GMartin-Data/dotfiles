[project]
name = "dbt-enveloppe"
version = "0.1.0"
description = "Guarded dbt wrapper: canonical calls, verified outputs, minimal replies."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
dbt-enveloppe = "dbt_enveloppe.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_enveloppe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
